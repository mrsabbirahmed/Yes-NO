
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yes or No</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Main Card -->
    <div class="card">

        <div class="heart">❤️</div>

        <h1>Do You Like Me?</h1>

        <p>Be honest... 🥺💕</p>


        <!-- Button Area -->
        <div class="buttons">

            <button class="yes" id="yesBtn">
                Yes ❤️
            </button>

            <button class="no" id="noBtn">
                No 😢
            </button>

        </div>


        <!-- Success Message -->
        <div class="success" id="success">

            <div class="success-heart">
                💖
            </div>

            <h2>Yay! 🥰</h2>

            <p>I knew you would say Yes! ❤️ Thank You🥰</p>

        </div>

    </div>

    <script src="js/script.js"></script>

</body>

</html>
